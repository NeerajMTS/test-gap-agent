[project]
name = "test-gap-agent"
version = "0.1.0"
description = "LLM agent that finds untested behaviors by matching a spec against existing pytest tests"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Neeraj Sharma" }]
dependencies = []

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.50"]
dev = ["pytest>=8"]

[project.scripts]
tga = "test_gap_agent.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["test_gap_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests", "examples/todo_app/tests"]
